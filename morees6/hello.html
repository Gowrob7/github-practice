<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calender</title>
    <style>
        .container{
            background-color: #ddd;
            padding: 10px;
            max-width: 100%;
        }
        .calender{
            display: grid;
            grid-template-columns: repeat(7,1fr);
           
        }
        .calender  p{
            background-color: aqua;
           max-width: 100px;
           padding: 20px;
            
            box-shadow: 2px 2px 3px 3px;
            border-radius: 8px;
            text-align: center;
            text-transform: uppercase;
            font-size: 24px;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
            
            
        }
        .calender h2{
               background-color: rgb(179, 255, 0);
           max-width: 60px;
           padding: 20px;
            
            box-shadow: 2px 2px 3px 3px;
            border-radius: 8px;
            text-align: center;
            text-transform: uppercase;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>October Month Calender</h1>
        <div class="calender">
            
                <p>sat</p>
                <p>Sun</p>
                <p>MOn</p>
                <p>Tue</p>
                <p>Wed</p>
                <p>Thu</p>
                <p>Fr</p>
            
            
                <h2>1</h2>
                <h2>2</h2>
                <h2>3</h2>
            <h2>4</h2>
            <h2>5</h2>
            <h2>6</h2>
            <h2>7</h2>
            <h2>8</h2>
            <h2>9</h2>
            <h2>10</h2>
            <h2>11</h2>
            <h2>12</h2>
            <h2>13</h2>
            <h2>14</h2>
            <h2>15</h2>
            <h2>16</h2>
            <h2>17</h2>
            <h2>18</h2>
            <h2>19</h2>
            <h2>20</h2>
            <h2>21</h2>
            <h2>22</h2>
            <h2>23</h2>
            <h2>24</h2>
            <h2>25</h2>
            <h2>26</h2>
            <h2>27</h2>
            <h2>28</h2>
            <h2>29</h2>
            <h2>30</h2>
            <h2>31</h2>

        </div>
    </div>
</body>
</html>
